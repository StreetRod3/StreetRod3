name: Export Godot web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # reference/ (source models, photos, drawings) is in LFS too but the game never
      # loads it, so the build skips it rather than download hundreds of MB each run.
      - name: Pull LFS files the game uses
        run: git lfs pull --exclude="reference/**"

      - name: Setup Godot 4.6.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Verify export presets
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "Missing export_presets.cfg!"
            exit 1
          fi
          godot --version

      - name: Import project
        run: godot --headless --import

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          # GitHub Pages runs Jekyll unless this file exists at the published root.
          touch build/web/.nojekyll

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 3
